<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <!-- Preload critical assets for faster rendering -->
  <link rel="preload" as="image" href="/src/assets/Group.png" />
  <link rel="preload" as="font" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" crossorigin />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-CW43S0J257"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-CW43S0J257');
  </script>
</head>

<body>
  <div id="root"></div>

  <!-- Handle unhandled promise rejections from third-party services -->
  <script>
    window.addEventListener('unhandledrejection', event => {
      if (event.reason && typeof event.reason === 'object' && event.reason.message && event.reason.message.includes('usoblackbox')) {
        event.preventDefault();
        console.warn('Third-party service error ignored');
      }
    });
  </script>

  <script type="module" src="/src/index.js"></script>
</body>

</html>
